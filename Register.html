    <main>

        <section class="formulario">

            <h2>Registrarse</h2>

            <form id="formRegistro">

                <label for="nombre">
                    Nombre:
                </label>

                <input type="text" id="nombre">

                <label for="correo">
                    Correo:
                </label>

                <input type="email" id="correo">

                <label for="password">
                    Contraseña:
                </label>

                <input type="password" id="password">

                <label for="confirmar">
                    Confirmar contraseña:
                </label>

                <input type="password" id="confirmar">

                <button type="submit">
                    Registrarse
                </button>

            </form>

            <p id="mensajeRegistro"></p>

        </section>
