            <h2>Contacto</h2>

            <p>
                Si tienes alguna duda o consulta, puedes escribirnos.
            </p>

            <form id="formContacto" class="formulario">

                <label for="contactoNombre">Nombre:</label>
                <input type="text" id="contactoNombre">

                <label for="contactoCorreo">Correo:</label>
                <input type="email" id="contactoCorreo">

                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto">

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje"></textarea>

                <button type="submit">Enviar mensaje</button>

                <p id="mensajeContacto"></p>

            </form>

        </section>
